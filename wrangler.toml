name = "edge-cms"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Import theme CSS files as text (.html and .sql are text by default).
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

# Scheduled publishing + migrations.
[triggers]
crons = ["*/5 * * * *"]

# --- Bindings -------------------------------------------------------------
# Create the resources once, then paste the IDs wrangler prints:
#   npx wrangler d1 create edge_cms
#   npx wrangler kv namespace create KV
#   npx wrangler r2 bucket create edge-cms-media

[[d1_databases]]
binding = "DB"
database_name = "edge_cms"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "edge-cms-media"

# Custom domain (optional). The CMS works on workers.dev without this.
# [[routes]]
# pattern = "example.com"
# custom_domain = true
