<header class="page-hero">
  <div class="page-hero__inner">
    <p class="eyebrow">Search the site</p>
    <h1>Search results</h1>
  </div>
</header>
<section class="content-wide search-content">
  <form class="search-form" action="/search" method="get"><label for="site-search">Search pages and posts</label><div><input id="site-search" type="search" name="q" value="{{search.query}}" maxlength="120" placeholder="Type to search…"><button class="button" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg><span>Search</span></button></div></form>
  {{#if search.query}}<p class="result-count">{{search.total}} result(s) for “{{search.query}}”</p>{{/if}}
  {{#if posts}}<div class="post-grid">{{#each posts}}<article class="post-card"><div class="post-card__body"><p class="meta"><svg class="icon" aria-hidden="true"><use href="#i-calendar"></use></svg><span>{{date}}</span></p><h2><a href="{{url}}">{{title}}</a></h2><p class="post-card__excerpt">{{excerpt}}</p><a class="read-more" href="{{url}}">Read more <svg class="icon icon--dir" aria-hidden="true"><use href="#i-arrow"></use></svg></a></div></article>{{/each}}</div>{{else}}{{#if search.query}}<p class="empty">No matching pages or posts were found.</p>{{/if}}{{/if}}
</section>
