<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{#if theme_css_url}}<link rel="stylesheet" href="{{{theme_css_url}}}">{{/if}}
<style nonce="{{nonce}}">{{{theme_css}}}</style>
{{{head}}}
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    {{#if site.logo}}<a class="logo logo--image" href="/"><img src="{{site.logo}}" alt="{{site.title}}">{{site.title}}</a>{{else}}<a class="logo" href="/">{{site.title}}</a>{{/if}}
    {{#if menu.primary}}
    <input type="checkbox" id="nav-open" class="nav-check" aria-label="Toggle menu">
    <label for="nav-open" class="menu-btn" aria-hidden="true">&#9776;</label>
    <nav class="site-nav" id="nav" aria-label="Primary">
      {{#each menu.primary}}<a href="{{url}}"{{#if active}} aria-current="page"{{/if}}>{{label}}</a>{{/each}}
    </nav>
    {{/if}}
  </div>
</header>
<main id="main">
{{{content}}}
</main>
{{> footer}}
{{{widgets.footer}}}
{{{footer}}}
</body>
</html>
