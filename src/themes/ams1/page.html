<article class="post">
  <header>
    <p class="byline">{{#if theme.page_label}}{{theme.page_label}}{{else}}Page{{/if}}</p>
    <h1>{{page.title}}</h1>
  </header>
  <div class="content">{{{page.content}}}</div>
  <p class="disclosure">Last reviewed {{year}} &middot; if something here is out of date, tell us and we will fix it.</p>
</article>
