<section class="measure list">
  <h1 class="list__head">{{archive.title}}</h1>
  {{#if posts}}
    {{#each posts}}
    <article class="entry-row">
      <div>
        <h2 class="entry-row__title"><a href="{{url}}">{{title}}</a></h2>
        <p class="entry-row__meta">{{#if theme.show_dates}}<time datetime="{{date_iso}}">{{date}}</time> &middot; {{/if}}{{excerpt}}</p>
      </div>
    </article>
    {{/each}}
    <nav class="pager" aria-label="Pagination">
      {{#if pagination.prev}}<a href="{{pagination.prev}}">&larr; Newer</a>{{/if}}
      {{#if pagination.next}}<a href="{{pagination.next}}">Older &rarr;</a>{{/if}}
    </nav>
  {{else}}
    <p class="empty">Nothing published here yet.</p>
  {{/if}}
</section>
