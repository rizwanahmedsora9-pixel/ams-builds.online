<section class="measure intro">
  {{#if page}}<h1 class="intro__title">{{page.title}}</h1>{{else}}<h1 class="intro__title">{{site.title}}</h1>{{/if}}
  {{#if theme.tagline}}<p class="intro__lede">{{theme.tagline}}</p>{{/if}}
  {{#if page}}<div class="content intro__body">{{{page.content}}}</div>{{/if}}
</section>
{{#if posts}}
<section class="measure list" aria-labelledby="latest">
  <h2 class="list__head" id="latest">Latest</h2>
  {{#each posts}}
  <article class="entry-row">
    {{#if featured_image}}<a class="entry-row__img" href="{{url}}" tabindex="-1"><img src="{{featured_image}}" alt="{{featured_alt}}" loading="lazy"></a>{{/if}}
    <div>
      <h3 class="entry-row__title"><a href="{{url}}">{{title}}</a></h3>
      <p class="entry-row__meta"><time datetime="{{date_iso}}">{{date}}</time></p>
      <p class="entry-row__excerpt">{{excerpt}}</p>
    </div>
  </article>
  {{/each}}
  <p class="list__more"><a href="/blog">All posts &rarr;</a></p>
</section>
{{/if}}
