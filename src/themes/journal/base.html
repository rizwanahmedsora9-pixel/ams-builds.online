<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{#if theme_css_url}}<link rel="stylesheet" href="{{{theme_css_url}}}">{{/if}}
<style nonce="{{nonce}}">{{{theme_css}}}</style>
<style nonce="{{nonce}}">:root{--measure:{{theme.width}}ch;--accent:{{theme.accent}}}</style>
{{{head}}}
</head>
<body class="{{body_class}}{{#if theme.drop_cap}} has-dropcap{{/if}}">
<a class="skip" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{{content}}}
{{{widgets.after-post}}}
</main>
{{> footer}}
{{{widgets.footer}}}
{{{footer}}}
</body>
</html>
