<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{#if theme_css_url}}<link rel="stylesheet" href="{{{theme_css_url}}}">{{/if}}
<style nonce="{{nonce}}">{{{theme_css}}}</style>
<style nonce="{{nonce}}">:root{--accent:{{theme.accent}};--cols:{{theme.columns}}}</style>
{{{head}}}
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <div class="shell bar__in">
    {{#if site.logo}}<a class="bar__brand" href="/"><img src="{{site.logo}}" alt="{{site.title}}"></a>{{else}}<a class="bar__brand" href="/">{{site.title}}</a>{{/if}}
    {{#if menu.primary}}
    <nav class="bar__nav" aria-label="Primary">
      {{#each menu.primary}}<a href="{{url}}"{{#if active}} aria-current="page"{{/if}}>{{label}}</a>{{/each}}
    </nav>
    {{/if}}
  </div>
</header>
<main id="main">
{{{content}}}
{{{widgets.hero-aside}}}
</main>
{{> footer}}
{{{widgets.footer}}}
{{{footer}}}
</body>
</html>
