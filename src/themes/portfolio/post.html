<article class="shell post">
  <header class="post__head">
    <p class="post__meta"><time datetime="{{post.date_iso}}">{{post.date}}</time>{{#if post.author}} &middot; {{post.author}}{{/if}}</p>
    <h1 class="post__title">{{post.title}}</h1>
    {{#each post.categories}}<a class="chip" href="{{url}}">{{name}}</a>{{/each}}
  </header>
  {{#if post.featured_image}}<img class="post__hero" src="{{post.featured_image}}" alt="{{post.featured_alt}}">{{/if}}
  <div class="prose">{{{post.content}}}</div>
  {{#if post.tags}}<p class="post__tags">{{#each post.tags}}<a href="{{url}}">#{{name}}</a>{{/each}}</p>{{/if}}
  <p class="post__back"><a href="/blog">&larr; All posts</a></p>
  {{{comments_html}}}
</article>
