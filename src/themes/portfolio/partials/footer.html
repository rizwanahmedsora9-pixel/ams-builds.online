<footer class="foot">
  <div class="shell foot__in">
    <p class="foot__brand">{{site.title}}</p>
    {{#if menu.footer}}<nav class="foot__nav" aria-label="Footer">{{#each menu.footer}}<a href="{{url}}">{{label}}</a>{{/each}}</nav>{{/if}}
    <p class="foot__meta">&copy; {{year}}</p>
  </div>
  {{> social}}
</footer>
