<!doctype html>
<html lang="en">
<head>
  {{{head}}}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{{theme_css_url}}}">
</head>
<body class="{{body_class}}" style="--starter-accent:{{theme.accent}};--starter-width:{{theme.content_width}}px">
  {{> header}}
  <main id="main" class="site-main">
    {{{content}}}
  </main>
  {{> footer}}
  {{{widgets.footer}}}
  {{{footer}}}
  <script defer src="{{asset "static/js/theme.js"}}"></script>
</body>
</html>
