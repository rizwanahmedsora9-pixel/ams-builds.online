<header class="entry-header"><h1>{{archive.title}}</h1></header>
{{#if posts}}
<div class="cards">
  {{#each posts}}
  <article class="card">
    {{#if featured_image}}<a href="{{url}}" tabindex="-1"><img src="{{featured_image}}" alt="{{featured_alt}}" loading="lazy"></a>{{/if}}
    <div class="card-body">
      <h2><a href="{{url}}">{{title}}</a></h2>
      <p class="meta"><time datetime="{{date_iso}}">{{date}}</time></p>
      <p>{{excerpt}}</p>
    </div>
  </article>
  {{/each}}
</div>
<nav class="pagination" aria-label="Pagination">
  {{#if pagination.prev}}<a href="{{pagination.prev}}">&larr; Newer</a>{{else}}<span></span>{{/if}}
  {{#if pagination.next}}<a href="{{pagination.next}}">Older &rarr;</a>{{/if}}
</nav>
{{else}}
<p class="empty">Nothing has been published here yet.</p>
{{/if}}
