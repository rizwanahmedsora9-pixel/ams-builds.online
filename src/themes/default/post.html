<article class="entry">
  <header class="entry-header">
    <h1>{{post.title}}</h1>
    <p class="meta">
      <time datetime="{{post.date_iso}}">{{post.date}}</time>{{#if post.author}} &middot; {{post.author}}{{/if}}
      {{#each post.categories}} &middot; <a href="{{url}}">{{name}}</a>{{/each}}
    </p>
  </header>
  {{#if post.featured_image}}<img class="featured" src="{{post.featured_image}}" alt="{{post.featured_alt}}">{{/if}}
  <div class="content">{{{post.content}}}</div>
  {{#if post.tags}}<p class="tags">{{#each post.tags}}<a href="{{url}}">#{{name}}</a>{{/each}}</p>{{/if}}
  {{{comments_html}}}
</article>
