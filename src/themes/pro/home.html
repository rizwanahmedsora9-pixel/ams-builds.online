<section class="hero">
  <div class="wrap">
    <h1>{{site.title}}</h1>
    {{#if site.tagline}}<p class="lead">{{site.tagline}}</p>{{/if}}
    <p class="hero-actions"><a class="btn" href="/blog">Latest posts</a></p>
  </div>
</section>
{{#if page}}
<section class="wrap section">
  <article class="panel content">{{{page.content}}}</article>
</section>
{{/if}}
{{#if posts}}
<section class="wrap section">
  <div class="section-head"><h2>Latest posts</h2><a href="/blog">View all &rarr;</a></div>
  <div class="grid">
    {{#each posts}}
    <article class="card">
      {{#if featured_image}}<a class="card-img" href="{{url}}" tabindex="-1"><img src="{{featured_image}}" alt="{{featured_alt}}" loading="lazy"></a>{{/if}}
      <div class="card-body">
        <p class="meta"><time datetime="{{date_iso}}">{{date}}</time></p>
        <h3><a href="{{url}}">{{title}}</a></h3>
        <p>{{excerpt}}</p>
      </div>
    </article>
    {{/each}}
  </div>
</section>
{{/if}}
