<header class="page-head"><div class="wrap"><h1>{{archive.title}}</h1></div></header>
<div class="wrap section">
  {{#if posts}}
  <div class="grid">
    {{#each posts}}
    <article class="card">
      {{#if featured_image}}<a class="card-img" href="{{url}}" tabindex="-1"><img src="{{featured_image}}" alt="{{featured_alt}}" loading="lazy"></a>{{/if}}
      <div class="card-body">
        <p class="meta"><time datetime="{{date_iso}}">{{date}}</time></p>
        <h2><a href="{{url}}">{{title}}</a></h2>
        <p>{{excerpt}}</p>
      </div>
    </article>
    {{/each}}
  </div>
  <nav class="pager" aria-label="Pagination">
    {{#if pagination.prev}}<a class="btn ghost" href="{{pagination.prev}}">&larr; Newer</a>{{else}}<span></span>{{/if}}
    {{#if pagination.next}}<a class="btn ghost" href="{{pagination.next}}">Older &rarr;</a>{{/if}}
  </nav>
  {{else}}
  <p class="empty">Nothing has been published here yet.</p>
  {{/if}}
</div>
